name: Pullwatch
options:
  bundleIdPrefix: nl.torrisi
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
packages:
  PullwatchCore:
    path: .
targets:
  Pullwatch:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: PullwatchCore
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Pullwatch
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [nl, en, de, fr]
        NSHumanReadableCopyright: "© 2026 Alessandro Torrisi"
        CFBundleShortVersionString: "0.3.2"
        CFBundleVersion: "6"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.torrisi.pullwatch
        PRODUCT_NAME: Pullwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
