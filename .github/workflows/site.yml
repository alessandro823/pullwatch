name: Website

# The website in site/ (Astro Starlight, site/README.md). Every pull request
# that touches it builds it twice, for the project page and for a custom
# domain, with the Pagefind index, and checks every internal link, so a
# broken site fails in the fork too. A push to main in alessandro823/pullwatch
# deploys it to GitHub Pages; a fork deploys only when its repository variable
# PAGES_DEPLOY is true (a preview at https://<owner>.github.io/<repo>/). The address
# is the repository variable PAGES_DOMAIN (docs/website.md): empty, the site
# is https://alessandro823.github.io/pullwatch/; set, https://<domain>/. After
# changing the variable, run this workflow by hand to deploy again.

on:
  # Every pull request, so "build and check links" can be a required check: a
  # pull request that does not touch the site skips the build (a skipped job
  # counts as passed for a required check).
  pull_request:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels its older build; a run on main is never
# cancelled half way through a deploy.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: site changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      site: ${{ steps.files.outputs.site }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | grep -qE '^(site/|\.github/workflows/site\.yml$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build and check links
    needs: changes
    # On a push or a manual run there is no changes job (it is skipped), so
    # build then; on a pull request only when it touches the site.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # No package needs its install scripts (sharp, esbuild and Pagefind ship
      # prebuilt binaries as optional packages), so none of them runs.
      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The other address first, so both builds are checked whatever the
      # variable holds; the build that is deployed comes last.
      - name: build for a custom domain and check its links
        env:
          PAGES_DOMAIN: pullwatch.net
        run: |
          npm run build
          npm run check-links
      - name: build for the configured address and check its links
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          rm -rf dist
          npm run build
          npm run check-links
          test -f dist/pagefind/pagefind.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: (github.repository == 'alessandro823/pullwatch' || vars.PAGES_DEPLOY == 'true') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # The changes job is skipped outside pull requests, and a skipped job
    # further up makes the implicit success() false, so ask for the build's
    # own result instead.
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.repository == 'alessandro823/pullwatch' || vars.PAGES_DEPLOY == 'true') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # IndexNow tells Bing, Yandex, Seznam and Naver which pages changed, so
      # they crawl them now instead of some day. The key is the file
      # site/public/<key>.txt; a failure here never fails the deploy.
      - name: tell search engines through IndexNow
        if: ${{ vars.PAGES_DOMAIN != '' }}
        continue-on-error: true
        env:
          DOMAIN: ${{ vars.PAGES_DOMAIN }}
          KEY: 2d23b6c65e81c2975e13d39327232aa3
        run: |
          sleep 30
          urls=$(curl -fsSL "https://$DOMAIN/sitemap-index.xml" \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | while read -r sitemap; do curl -fsSL "$sitemap"; done \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --arg host "$DOMAIN" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}' \
            | curl -fsS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
